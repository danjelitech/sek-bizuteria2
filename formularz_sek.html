<h2>Formularz kontaktowy</h2>
<p class="note">Tutaj będzie formularz – możesz wykorzystać go do przygotowania wiadomości do sklepu.</p>
<form action="mailto:kontakt@lunea.example" method="post" enctype="text/plain">
  <label for="name">Imię i nazwisko</label>
  <input id="name" name="Imię i nazwisko" type="text" placeholder="Wpisz swoje imię i nazwisko" required>
  <label for="email">Adres e-mail</label>
  <input id="email" name="E-mail" type="email" placeholder="np. anna@example.com" required>
  <label for="topic">Temat wiadomości</label>
  <select id="topic" name="Temat">
    <option>Zapytanie o produkt</option><option>Biżuteria na prezent</option><option>Inne pytanie</option>
  </select>
  <label for="message">Treść wiadomości</label>
  <textarea id="message" name="Wiadomość" placeholder="W czym możemy pomóc?"></textarea>
  <p><button type="submit">Przygotuj wiadomość</button></p>
</form>
